# DeepAI 注册机 — 配置示例
# 复制为 config.yaml 再改；所有字段都可被命令行覆盖。

engine: auto            # protocol | browser | auto（protocol 被拦时自动切 Camoufox）
count: 5
concurrency: 2          # 每个并发线程 = 一条独立 cookie jar + 一个 persona
attempts: 3             # 单账号失败重试次数（换邮箱/换代理）
delay: [4, 9]           # 两次尝试之间的随机停顿（秒）
timeout: 45
headless: true          # browser 引擎是否无头
language: en-US
geoip: true             # Camoufox 按代理出口 IP 自动对齐 时区/语言/经纬度
user_agent: ""          # 留空 = 每次随机 Firefox UA
verify_email: true      # 注册后轮询邮箱等验证邮件（当前注册不强制验证，超时不算失败）
screenshot_on_fail: true
output_dir: out

# 代理池：轮转使用，一个账号粘一个出口。
# 留空则读环境变量 HTTPS_PROXY / ALL_PROXY。
proxies:
  - http://127.0.0.1:10808
  # - socks5://user:pass@10.0.0.7:1080
  # - 10.0.0.8:8080

mail:
  provider: tempmail_lol   # tempmail_lol | mailtm | imap | fixed
  domain: ""               # 指定域名；imap 时 = 你的 catch-all 域名
  address: ""              # provider=fixed 时用：你自有邮箱，程序自动 +tag
  prefix: ""               # imap：本地部分前缀，如 "dai"
  imap_host: ""            # 也可用环境变量 DEEPAI_IMAP_HOST
  imap_port: 993
  imap_user: ""            # DEEPAI_IMAP_USER
  imap_password: ""        # DEEPAI_IMAP_PASSWORD
  verify_timeout: 180
